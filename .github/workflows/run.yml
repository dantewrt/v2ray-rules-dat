name: Build V2Ray rules dat files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches:
      - master
      - rule
      - hidden
    paths-ignore:
      - "**/README.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMEMLIMIT: 10GiB
  GOGC: 50

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "EASYLIST_REJECT_URL=https://easylist.to/easylist/easylist.txt" >> $GITHUB_ENV
          echo "PETERLOWE_REJECT_URL=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext" >> $GITHUB_ENV
          echo "ADGUARD_DNS_REJECT_URL=https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" >> $GITHUB_ENV
          echo "DANPOLLOCK_REJECT_URL=https://someonewhocares.org/hosts/hosts" >> $GITHUB_ENV
          echo "WIN_SPY=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt" >> $GITHUB_ENV
          echo "WIN_UPDATE=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/update.txt" >> $GITHUB_ENV
          echo "WIN_EXTRA=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/extra.txt" >> $GITHUB_ENV
          echo "RULE_GAME=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_gaming.txt" >> $GITHUB_ENV
          echo "RULE_INDO=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_indo.txt" >> $GITHUB_ENV
          echo "RULE_PS=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_playstore.txt" >> $GITHUB_ENV
          echo "RULE_SOSMED=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_sosmed.txt" >> $GITHUB_ENV
          echo "RULE_STREAMING=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_streaming.txt" >> $GITHUB_ENV
          echo "RULE_UMUM=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_umum.txt" >> $GITHUB_ENV
          echo "RULE_IPCHECK=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_ipcheck.txt" >> $GITHUB_ENV
          echo "RULE_VIDCONFERENCE=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_videoconference.txt" >> $GITHUB_ENV
          echo "URLTEST=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/urltest.txt" >> $GITHUB_ENV
          echo "RULE_SPEEDTEST=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_speedtest.txt" >> $GITHUB_ENV
          echo "RULE_BANK_ID=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_bank-id.txt" >> $GITHUB_ENV
          echo "RULE_ECOMMERCE=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_ecommerce.txt" >> $GITHUB_ENV
          echo "OISD_FULL=https://big.oisd.nl/dnsmasq" >> $GITHUB_ENV
          echo "RULE_ADS=https://raw.githubusercontent.com/d3ward/toolz/master/src/d3host.txt" >> $GITHUB_ENV
          echo "RULE_ADS_EXTENDED=https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule_ads.txt" >> $GITHUB_ENV
        shell: bash

      - name: Checkout the "hidden" branch of this repo
        uses: actions/checkout@v7
        with:
          ref: hidden

      - name: Checkout Loyalsoldier/domain-list-custom
        uses: actions/checkout@v7
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum

      - name: Get geoip.dat related files
        run: |
          wget https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat
          wget https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat.sha256sum

      - name: Get and add global reject domains into temp-reject.txt file
        run: |
          curl -L --retry 3 --fail-with-body "$EASYLIST_REJECT_URL" | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' > temp-reject.txt
          curl -L --retry 3 --fail-with-body "$ADGUARD_DNS_REJECT_URL" | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' >> temp-reject.txt
          curl -L --retry 3 --fail-with-body "$PETERLOWE_REJECT_URL" | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})$/ && print "$1\n"' >> temp-reject.txt
          curl -L --retry 3 --fail-with-body "$DANPOLLOCK_REJECT_URL" | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})/ && print "$1\n"' | sed '1d' >> temp-reject.txt

      - name: Add reject domains from "hidden" branch to temp file
        run: |
          cat reject.txt >> temp-reject.txt

      - name: Sort and generate redundant list
        run: |
          cat temp-reject.txt | sort --ignore-case -u > reject-list-with-redundant

      - name: Remove redundant domains
        run: |
          chmod +x findRedundantDomain.py
          python3 ./findRedundantDomain.py ./reject-list-with-redundant ./reject-list-deleted-unsort
          [ ! -f "reject-list-deleted-unsort" ] && touch reject-list-deleted-unsort
          grep -Fvxif ./reject-list-deleted-unsort ./reject-list-with-redundant > ./reject-list-without-redundant || [ "$?" -eq 1 ]

      - name: Remove domains from "need-to-remove" list in "hidden" branch
        run: |
          grep -Fvxif ./reject-need-to-remove.txt ./reject-list-without-redundant > temp-category-ads-all.txt || [ "$?" -eq 1 ]

      - name: Write reject list to data directory
        run: |
          cat temp-category-ads-all.txt | sort --ignore-case -u | perl -ne '/^((?=^.{1,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})*)/ && print "$1\n"' > ./community/data/category-ads-all
          if [ -f "reject-reserve.txt" ]; then
            cat reject-reserve.txt >> ./community/data/category-ads-all
          fi

      - name: Empty China-specific lists and create telemetry, adblock & custom Indonesia lists
        run: |
          # Kosongkan daftar khusus China agar tidak ikut terkompilasi tanpa merusak referensi internal v2fly
          for cn_file in cn geolocation-\!cn china-list google-cn apple-cn gfw greatfire; do
            : > "./community/data/${cn_file}"
          done

          # Telemetri Windows
          curl -L --retry 3 --fail-with-body "$WIN_SPY" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-spy
          curl -L --retry 3 --fail-with-body "$WIN_UPDATE" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-update
          curl -L --retry 3 --fail-with-body "$WIN_EXTRA" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-extra

          # Daftar kustom Indonesia, aplikasi, game, streaming, dan perbankan
          curl -L --retry 3 --fail-with-body "$RULE_GAME" | tr -d '\r' > ./community/data/rule-gaming
          curl -L --retry 3 --fail-with-body "$RULE_INDO" | tr -d '\r' > ./community/data/rule-indo
          curl -L --retry 3 --fail-with-body "$RULE_PS" | tr -d '\r' > ./community/data/rule-playstore
          curl -L --retry 3 --fail-with-body "$RULE_SOSMED" | tr -d '\r' > ./community/data/rule-sosmed
          curl -L --retry 3 --fail-with-body "$RULE_STREAMING" | tr -d '\r' > ./community/data/rule-streaming
          curl -L --retry 3 --fail-with-body "$RULE_SPEEDTEST" | tr -d '\r' > ./community/data/rule-speedtest
          curl -L --retry 3 --fail-with-body "$RULE_UMUM" | tr -d '\r' > ./community/data/rule-umum
          curl -L --retry 3 --fail-with-body "$RULE_IPCHECK" | tr -d '\r' > ./community/data/rule-ipcheck
          curl -L --retry 3 --fail-with-body "$RULE_VIDCONFERENCE" | tr -d '\r' > ./community/data/videoconference
          curl -L --retry 3 --fail-with-body "$URLTEST" | tr -d '\r' > ./community/data/urltest
          curl -L --retry 3 --fail-with-body "$RULE_BANK_ID" | tr -d '\r' > ./community/data/bank-id
          curl -L --retry 3 --fail-with-body "$RULE_ECOMMERCE" | tr -d '\r' > ./community/data/ecommerce-id

          # Daftar pemblokiran iklan (oisd-full + rule-ads + rule-ads-extended)
          curl -L --retry 3 --fail-with-body "$OISD_FULL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > ./community/data/oisd-full
          curl -L --retry 3 --fail-with-body "$RULE_ADS" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/rule-ads
          (curl -L --retry 3 --fail-with-body "$RULE_ADS_EXTENDED" || curl -L --retry 3 --fail-with-body "https://raw.githubusercontent.com/dantewrt/v2ray-rules-dat/rule/rule-ads.txt") | tr -d '\r' >> ./community/data/rule-ads

      - name: Build geosite.dat file
        run: |
          cd custom || exit 1
          go build -ldflags="-s -w" -o dlc-builder ./
          ./dlc-builder --datapath=../community/data

      - name: Move release files and generate sha256 hash
        run: |
          install -Dp ./GeoIP.dat ./publish/GeoIP.dat
          install -Dp ./GeoIP.dat.sha256sum ./publish/GeoIP.dat.sha256sum
          install -Dp ./custom/publish/GeoSite.dat ./publish/GeoSite.dat
          cd ./publish || exit 1
          sha256sum GeoSite.dat > GeoSite.dat.sha256sum

      - name: Release and upload assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch
        if: github.event_name != 'pull_request'
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsdelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          cd publish || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      - name: Delete Old Release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          repo: dantewrt/v2ray-rules-dat
          keep_latest: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}